<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seedance Prompt Lite | AI 视频提示词生成器</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg-bg: linear-gradient(135deg, #6366f1, #8b5cf6);
            --bot-msg-bg: rgba(30, 41, 59, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .glass {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
        }

        /* --- App Layout --- */
        .app-container {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* --- Sidebar Settings --- */
        .sidebar {
            width: 320px;
            height: 100%;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--surface-border);
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .app-title {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .settings-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .custom-select {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat, repeat;
            background-position: right .7em top 50%, 0 0;
            background-size: .65em auto, 100%;
        }

        .custom-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .custom-select option {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: auto;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .status-badge.error {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }

        /* --- Main Chat Area --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--surface-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .message {
            max-width: 85%;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.bot {
            align-self: flex-start;
        }

        .message-content {
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: var(--user-msg-bg);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .message.bot .message-content {
            background: var(--bot-msg-bg);
            border: 1px solid var(--surface-border);
            border-bottom-left-radius: 4px;
        }

        /* Markdown Styles within bot messages */
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            margin-top: 1em;
            margin-bottom: 0.5em;
            font-weight: 600;
        }

        .markdown-body h1 {
            font-size: 1.4em;
        }

        .markdown-body h2 {
            font-size: 1.2em;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 0.3em;
        }

        .markdown-body p {
            margin-bottom: 1em;
        }

        .markdown-body p:last-child {
            margin-bottom: 0;
        }

        .markdown-body pre {
            background: rgba(15, 23, 42, 0.8);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 1em;
            border: 1px solid var(--surface-border);
        }

        .markdown-body code {
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.9em;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 4px;
            border-radius: 4px;
        }

        .markdown-body pre code {
            background: none;
            padding: 0;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin-left: 20px;
            margin-bottom: 1em;
        }

        .markdown-body blockquote {
            border-left: 4px solid var(--primary);
            padding-left: 12px;
            color: var(--text-muted);
            margin-bottom: 1em;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 0 8px 8px 0;
        }

        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 4px 8px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        /* --- Input Area --- */
        .input-area {
            padding: 20px 24px;
            background: rgba(15, 23, 42, 0.4);
            border-top: 1px solid var(--surface-border);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 8px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 8px 12px;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            height: 44px;
            max-height: 200px;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .send-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 40vh;
                border-right: none;
                border-bottom: 1px solid var(--surface-border);
            }

            .message {
                max-width: 95%;
            }
        }
    </style>
</head>

<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass">
            <div class="app-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 10L19.5 7.40192V16.5981L15 14V10Z" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                    <path
                        d="M5 6H13C14.1046 6 15 6.89543 15 8V16C15 17.1046 14.1046 18 13 18H5C3.89543 18 3 17.1046 3 16V8C3 6.89543 3.89543 6 5 6Z"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Seedance Prompt Lite
            </div>

            <p style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.5;">
                专业的即梦 AI 视频提示词生成器。请输入您的模型 API 密钥开始使用。
            </p>

            <div class="settings-group">
                <label for="versionSelect">工作流版本</label>
                <select id="versionSelect" class="custom-select">
                    <option value="lite">Lite 版 (轻量极速，适合零门槛)</option>
                    <option value="pro">Pro 版 (专业沉浸，要求更高发问质量)</option>
                </select>
            </div>

            <div class="settings-group">
                <label for="providerSelect">服务商 (Provider)</label>
                <select id="providerSelect" class="custom-select">
                    <option value="deepseek">DeepSeek</option>
                    <option value="moonshot">Kimi (Moonshot)</option>
                    <option value="zhipu">GLM (智谱清言)</option>
                    <option value="minimax">MiniMax</option>
                    <option value="qwen">通义千问 (Qwen)</option>
                    <option value="doubao">豆包 (Doubao)</option>
                    <option value="custom">自定义 (Custom)</option>
                </select>
            </div>

            <div class="settings-group">
                <label for="apiKey">API Key</label>
                <input type="password" id="apiKey" placeholder="输入 API Key" autocomplete="off">
            </div>

            <div id="advancedConfig" style="display: none; flex-direction: column; gap: 20px;">
                <div class="settings-group" style="margin-top: 12px;">
                    <label for="baseUrl">Base URL (OpenAI 兼容)</label>
                    <input type="text" id="baseUrl" value="https://api.openai.com/v1">
                </div>

                <div class="settings-group">
                    <label for="modelName" id="modelLabel">模型名称</label>
                    <input type="text" id="modelName" value="gpt-4o">
                </div>
            </div>

            <button class="btn" id="saveSettingsBtn" style="margin-top: 8px;">保存设置并初始化</button>

            <div class="status-badge" id="systemStatus">
                <span
                    style="display:inline-block; width:6px; height:6px; background:currentColor; border-radius:50%; margin-right:6px;"></span>
                <span id="statusText">等待配置 API...</span>
            </div>
        </aside>

        <!-- Main Chat -->
        <main class="chat-area">
            <div class="chat-header glass">
                <h2>✨ AI 视频提示词生成室</h2>
                <button class="btn" id="clearChatBtn"
                    style="padding: 6px 12px; font-size: 0.85rem; background: rgba(255,255,255,0.1);">清空对话</button>
            </div>

            <div class="chat-messages" id="chatBox">
                <!-- Welcome Message -->
                <div class="message bot">
                    <div class="message-content markdown-body">
                        你好！我是专业的即梦 AI 视频提示词工程师。
                        <br><br>
                        请在左侧配置您的 API Key。配置完成后，你可以随时向我描述你的构思，例如：
                        <ul>
                            <li>"帮我写一个15秒的高级香水电商广告，时间轴分镜控制，音乐踩点"</li>
                            <li>"总裁把甩出黑卡，三分讥笑七分凉薄。10秒，竖屏短剧质感"</li>
                            <li>"5秒的未来医疗机器人解剖，4K超清微距"</li>
                        </ul>
                        我会用最专业的 **双模式与时间轴分镜法** 为您生成完美的 Prompt！
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="userInput" placeholder="描述您的视频创意... (Shift+Enter 换行, Enter 发送)" disabled></textarea>
                    <button class="send-btn" id="sendBtn" disabled>
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.993.993 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.06-.87.49-.87.99l.01 4.61c0 .71.73 1.2 1.39.92z" />
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const PROVIDERS = {
            'deepseek': { name: 'DeepSeek', url: 'https://api.deepseek.com', model: 'deepseek-chat' },
            'moonshot': { name: 'Kimi (Moonshot)', url: 'https://api.moonshot.cn/v1', model: 'moonshot-v1-8k' },
            'zhipu': { name: 'GLM (智谱清言)', url: 'https://open.bigmodel.cn/api/paas/v4', model: 'glm-4-flash' },
            'minimax': { name: 'MiniMax', url: 'https://api.minimax.chat/v1', model: 'abab6.5s-chat' },
            'qwen': { name: '通义千问 (Qwen)', url: 'https://dashscope.aliyuncs.com/compatible-mode/v1', model: 'qwen-plus' },
            'doubao': { name: '豆包 (Doubao)', url: 'https://ark.cn-beijing.volces.com/api/v3', model: 'ep-xxxxxxxx-xxxx' },
            'custom': { name: '自定义配置', url: 'https://api.openai.com/v1', model: 'gpt-4o' }
        };

        // DOM Elements
        const versionSelect = document.getElementById('versionSelect');
        const providerSelect = document.getElementById('providerSelect');
        const advancedConfig = document.getElementById('advancedConfig');
        const modelLabel = document.getElementById('modelLabel');
        const apiKeyInput = document.getElementById('apiKey');
        const baseUrlInput = document.getElementById('baseUrl');
        const modelNameInput = document.getElementById('modelName');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const systemStatus = document.getElementById('systemStatus');
        const statusText = document.getElementById('statusText');
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearChatBtn = document.getElementById('clearChatBtn');

        let chatHistory = [];
        let systemPromptText = "";

        // Initialize marked.js options
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        providerSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'custom') {
                advancedConfig.style.display = 'flex';
                modelLabel.textContent = "模型名称";
            } else if (val === 'doubao') {
                advancedConfig.style.display = 'flex';
                baseUrlInput.value = PROVIDERS[val].url;
                modelNameInput.value = PROVIDERS[val].model;
                modelLabel.textContent = "模型接入点 (Endpoint ID)";
            } else {
                advancedConfig.style.display = 'none';
                baseUrlInput.value = PROVIDERS[val].url;
                modelNameInput.value = PROVIDERS[val].model;
                modelLabel.textContent = "模型名称";
            }
        });

        const encodeKey = (str) => btoa(encodeURIComponent(str));
        const decodeKey = (str) => decodeURIComponent(atob(str));

        // Load settings from localStorage
        window.addEventListener('DOMContentLoaded', () => {
            const savedVersion = localStorage.getItem('seedance_version') || 'lite';
            const savedProvider = localStorage.getItem('seedance_provider') || 'deepseek';
            const savedKeyEnc = localStorage.getItem('seedance_api_key_enc');
            const savedKeyLegacy = localStorage.getItem('seedance_api_key');
            const savedUrl = localStorage.getItem('seedance_base_url');
            const savedModel = localStorage.getItem('seedance_model');

            versionSelect.value = savedVersion;
            providerSelect.value = savedProvider;
            providerSelect.dispatchEvent(new Event('change'));

            if (savedKeyEnc) {
                try { apiKeyInput.value = decodeKey(savedKeyEnc); }
                catch (e) { apiKeyInput.value = savedKeyEnc; }
            } else if (savedKeyLegacy) {
                apiKeyInput.value = savedKeyLegacy;
            }

            if (savedProvider === 'custom' || savedProvider === 'doubao') {
                if (savedUrl) baseUrlInput.value = savedUrl;
                if (savedModel) modelNameInput.value = savedModel;
            }

            if (apiKeyInput.value) {
                initializeSystem();
            }
        });

        // Load the chosen skill file to act as System Prompt
        async function loadSystemPrompt() {
            try {
                const fileName = versionSelect.value === 'pro' ? 'SKILL.md' : 'SKILL-Lite.md';
                // Fetch the markdown from the repository relative path
                let fetchUrl = `./${fileName}`;
                // 如果是本地 file:// 协议打开，则使用 GitHub Raw 链接避免跨域报错
                if (window.location.protocol === 'file:') {
                    fetchUrl = `https://raw.githubusercontent.com/lmr1123/seedance-video-prompt/main/${fileName}`;
                }
                const response = await fetch(fetchUrl);
                if (!response.ok) {
                    throw new Error('网络请求失败，可能是本地跨域或文件不存在。');
                }
                const text = await response.text();
                // Extract just the content below the frontmatter
                const mainContent = text.replace(/---[\s\S]*?---/, '').trim();
                systemPromptText = mainContent;
                return true;
            } catch (err) {
                console.error("加载技能文件失败:", err);
                systemPromptText = "你是专业的即梦 AI 视频提示词工程师。请务必优先要求使用防翻车负面词汇，并使用诸如 0-3秒 的分镜方式规划视频。"; // Fallback
                return false;
            }
        }

        async function initializeSystem() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                updateStatus('error', '请提供 API Key');
                return;
            }

            const provider = providerSelect.value;
            localStorage.setItem('seedance_version', versionSelect.value);
            localStorage.setItem('seedance_provider', provider);
            localStorage.setItem('seedance_api_key_enc', encodeKey(key));
            localStorage.removeItem('seedance_api_key'); // clear legacy plain text
            localStorage.setItem('seedance_base_url', baseUrlInput.value.trim());
            localStorage.setItem('seedance_model', modelNameInput.value.trim());

            updateStatus('success', '正在加载核心技能...');

            await loadSystemPrompt();

            // Reset history
            chatHistory = [{
                role: "system",
                content: systemPromptText
            }];

            updateStatus('success', '系统就绪！');
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        saveSettingsBtn.addEventListener('click', initializeSystem);

        function updateStatus(type, text) {
            statusText.textContent = text;
            if (type === 'error') {
                systemStatus.className = 'status-badge error';
            } else {
                systemStatus.className = 'status-badge';
            }
        }

        // Auto-resize textarea
        userInput.addEventListener('input', function () {
            this.style.height = '44px';
            this.style.height = (this.scrollHeight) + 'px';
            if (this.value.trim()) {
                sendBtn.style.opacity = '1';
            } else {
                sendBtn.style.opacity = '0.7';
            }
        });

        // Handle Enter key to send
        userInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        sendBtn.addEventListener('click', sendMessage);
        clearChatBtn.addEventListener('click', () => {
            chatBox.innerHTML = '';
            chatHistory = [{ role: "system", content: systemPromptText }];
            addBotMessage("对话已清空，我们可以重新开始构思您的视频！");
        });

        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = `<div class="message-content">${escapeHTML(text)}</div>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addBotMessage(text, isMarkdown = false) {
            const div = document.createElement('div');
            div.className = 'message bot';
            // Render markdown or plain text
            const content = isMarkdown ? marked.parse(text) : escapeHTML(text);
            div.innerHTML = `<div class="message-content markdown-body">${content}</div>`;
            chatBox.appendChild(div);
            scrollToBottom();
            return div;
        }

        function showTypingIndicator() {
            const div = document.createElement('div');
            div.className = 'message bot typing-message';
            div.innerHTML = `
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatBox.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 50);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g,
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || !apiKeyInput.value) return;

            // Reset input
            userInput.value = '';
            userInput.style.height = '44px';
            userInput.disabled = true;
            sendBtn.disabled = true;

            addUserMessage(text);
            chatHistory.push({ role: "user", content: text });

            const typingDiv = showTypingIndicator();

            try {
                const response = await fetch(`${baseUrlInput.value.replace(/\/$/, '')}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKeyInput.value.trim()}`
                    },
                    body: JSON.stringify({
                        model: modelNameInput.value.trim(),
                        messages: chatHistory,
                        stream: true,
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || 'API 请求失败');
                }

                // Remove typing indicator
                typingDiv.remove();

                // Create empty bot message for streaming
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot';
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content markdown-body';
                botDiv.appendChild(contentDiv);
                chatBox.appendChild(botDiv);

                let botFullReply = "";

                // Read Stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n').filter(line => line.trim() !== '');

                    for (const line of lines) {
                        if (line.includes('[DONE]')) break;
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                if (data.choices[0].delta && data.choices[0].delta.content) {
                                    botFullReply += data.choices[0].delta.content;
                                    contentDiv.innerHTML = marked.parse(botFullReply);
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                }
                            } catch (e) {
                                // Incomplete JSON chunk, string concat handles next iteration
                            }
                        }
                    }
                }

                chatHistory.push({ role: "assistant", content: botFullReply });

            } catch (error) {
                typingDiv.remove();
                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    addBotMessage(`❌ 发送失败 / Failed to Fetch: 请求被拦截或网络不通。\n\n**【排查建议】**\n1. 🛡️ **跨域限制 (CORS)**：部分国产模型（如 \`Kimi\`、\`MiniMax\`）的官方 API 不允许前端浏览器直接调用。**建议切换为 \`DeepSeek\`、\`豆包\` 或 \`智谱 GLM\`，它们原生支持网页端直接调用。**\n2. 🌐 **网络环境**：如果您使用的是自定义的境外接口（如 OpenAI），请检查本地是否已开启全局网络代理。\n3. 🔑 **配置错误**：请检查 Base URL 中是否有不可见的空格或格式错误。`, true);
                } else {
                    addBotMessage(`❌ 发送失败: ${error.message}`);
                }
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
    </script>
</body>

</html>
